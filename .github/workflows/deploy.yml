name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: battle-plan/package-lock.json

      - name: Install dependencies
        working-directory: battle-plan
        run: npm ci

      - name: Bump version (tag-triggered)
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: battle-plan
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Tag push detected, setting version to $TAG_VERSION"
          npm version "$TAG_VERSION" --no-git-tag-version --commit-hooks=false
          git add package.json package-lock.json
          git commit -m "chore(release): bump version to $TAG_VERSION"
          git push origin HEAD:main

      - name: Bump version (auto-patch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: battle-plan
        run: |
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$LAST_COMMIT_MSG" == "chore(release): bump version to "* ]]; then
            echo "Last commit is already a version bump, skipping"
          else
            npm version patch --no-git-tag-version --commit-hooks=false
            NEW_VERSION=$(node -p "require('./package.json').version")
            echo "Bumping patch version to $NEW_VERSION"
            git add package.json package-lock.json
            git commit -m "chore(release): bump version to $NEW_VERSION"
            git push origin HEAD:main
          fi

      - name: Lint
        working-directory: battle-plan
        run: npm run lint

      - name: Test
        working-directory: battle-plan
        run: npm test

      - name: Build
        working-directory: battle-plan
        run: npm run build
        env:
          BP_BUILD_COMMIT: ${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: battle-plan/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
